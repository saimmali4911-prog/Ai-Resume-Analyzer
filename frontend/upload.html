<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Resume · ResumeAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Mobile drawer button -->
  <button class="btn btn-grad d-lg-none position-fixed m-2" style="z-index:30" id="menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar -->
  <aside class="side">
    <div class="brand"><i class="bi bi-stars"></i> ResumeAI</div>
    <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a href="upload.html"><i class="bi bi-cloud-arrow-up"></i> Upload Resume</a>
    <a href="tool.html?kind=analysis"><i class="bi bi-graph-up"></i> Resume Analysis</a>
    <a href="tool.html?kind=ats"><i class="bi bi-shield-check"></i> ATS Checker</a>
    <a href="tool.html?kind=match"><i class="bi bi-bullseye"></i> Job Matching</a>
    <a href="tool.html?kind=improve"><i class="bi bi-magic"></i> AI Improvements</a>
    <a href="history.html"><i class="bi bi-clock-history"></i> Analysis History</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a>
    <button id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h3 class="fw-bold">Upload Resume</h3>
    <p class="text-muted">Accepted: PDF, DOCX · Max size 5 MB</p>

    <div id="alert-box"></div>

    <form class="cardx mb-4" id="upform" style="height:auto">
      <label class="drop" id="drop">
        <i class="bi bi-cloud-arrow-up fs-1 text-grad"></i>
        <div class="fw-semibold" id="dname">Drag &amp; drop your resume here or click to browse</div>
        <input type="file" id="fileinp" accept=".pdf,.docx" hidden>
      </label>
      <input class="form-control my-3" id="resume-title" placeholder="Resume title (optional)" maxlength="150">
      <button type="submit" class="btn btn-grad">Upload &amp; extract text</button>
    </form>

    <h5 class="fw-bold mb-3">Your Resumes</h5>
    <div class="row g-3" id="resume-grid">
      <p class="text-muted">Loading your resumes...</p>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="pm">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="pt"></h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <pre id="pb" style="white-space:pre-wrap;font-family:inherit"></pre>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initUpload());
  </script>
</body>
</html>
