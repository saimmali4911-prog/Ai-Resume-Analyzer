<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile &middot; ResumeXpert AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Mobile menu button -->
  <button class="d-lg-none position-fixed m-2" style="z-index:40;top:0;left:0;background:var(--grad);border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.2rem;display:flex;align-items:center;justify-content:center;" id="menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="side" id="sidebar">
    <div class="brand"><i class="bi bi-stars"></i> ResumeXpert AI</div>

    <div class="side-section-label">Main</div>
    <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a href="upload.html"><i class="bi bi-cloud-arrow-up"></i> Upload Resume</a>

    <div class="side-divider"></div>
    <div class="side-section-label">AI Tools</div>
    <a href="tool.html?kind=analysis"><i class="bi bi-graph-up"></i> Resume Analysis</a>
    <a href="tool.html?kind=ats"><i class="bi bi-shield-check"></i> ATS Checker</a>
    <a href="tool.html?kind=match"><i class="bi bi-bullseye"></i> Job Matching</a>
    <a href="tool.html?kind=improve"><i class="bi bi-magic"></i> AI Improvements</a>

    <div class="side-divider"></div>
    <div class="side-section-label">Account</div>
    <a href="history.html"><i class="bi bi-clock-history"></i> Analysis History</a>
    <a href="profile.html" class="active"><i class="bi bi-person-circle"></i> My Profile</a>
    <button id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <!-- Page Header -->
    <div class="page-header text-center">
      <div class="d-flex flex-column align-items-center justify-content-center text-center">
        <div class="feature-icon mb-3" style="width:56px;height:56px;font-size:1.4rem;">
          <i class="bi bi-person-circle"></i>
        </div>
        <h2 class="fw-bold text-white mb-2" style="font-size:1.75rem;">My Profile</h2>
        <p class="text-muted mb-0" style="font-size:.95rem;">
          Signed in as <strong id="profile-username" style="color:var(--accent);">...</strong>
        </p>
      </div>
    </div>

    <!-- Alert box -->
    <div id="alert-box" class="mb-3"></div>

    <!-- Profile Card -->
    <div class="row g-4">
      <!-- Avatar / Info Card -->
      <div class="col-lg-4">
        <div class="cardx text-center" style="height:auto;">
          <div class="feature-icon mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">
            <i class="bi bi-person"></i>
          </div>
          <h5 class="fw-bold mb-1" id="avatar-name">Your Name</h5>
          <p class="text-muted mb-3" style="font-size:.85rem;" id="avatar-role">Target Role</p>
          <div class="d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2 justify-content-center" style="font-size:.85rem;color:var(--muted);">
              <i class="bi bi-envelope"></i>
              <span id="avatar-email">—</span>
            </div>
            <div class="d-flex align-items-center gap-2 justify-content-center" style="font-size:.85rem;color:var(--muted);">
              <i class="bi bi-telephone"></i>
              <span id="avatar-phone">—</span>
            </div>
          </div>
          <div class="side-divider mt-4 mb-3"></div>
          <div class="d-flex justify-content-between" style="font-size:.8rem;color:var(--muted);">
            <span><i class="bi bi-shield-check me-1" style="color:var(--success);"></i> Verified</span>
            <span><i class="bi bi-stars me-1" style="color:var(--accent);"></i> AI Member</span>
          </div>
        </div>
      </div>

      <!-- Edit Form Card -->
      <div class="col-lg-8">
        <div class="cardx" style="height:auto;">
          <h5 class="fw-bold mb-4" style="font-size:1rem;">
            <i class="bi bi-pencil-square me-2" style="color:var(--accent);"></i>Edit Profile
          </h5>
          <form id="profile-form">
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label class="form-label fw-semibold" for="first_name" style="font-size:.85rem;color:var(--muted);">First Name</label>
                <input type="text" class="form-control" id="first_name" placeholder="John">
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold" for="last_name" style="font-size:.85rem;color:var(--muted);">Last Name</label>
                <input type="text" class="form-control" id="last_name" placeholder="Doe">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="email" style="font-size:.85rem;color:var(--muted);">Email Address</label>
              <div class="input-group">
                <span class="input-group-text" style="background:var(--surface-2);border-color:var(--border);color:var(--muted);">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="phone" style="font-size:.85rem;color:var(--muted);">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text" style="background:var(--surface-2);border-color:var(--border);color:var(--muted);">
                  <i class="bi bi-telephone"></i>
                </span>
                <input type="text" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="target_role" style="font-size:.85rem;color:var(--muted);">Target Role</label>
              <div class="input-group">
                <span class="input-group-text" style="background:var(--surface-2);border-color:var(--border);color:var(--muted);">
                  <i class="bi bi-briefcase"></i>
                </span>
                <input type="text" class="form-control" id="target_role" placeholder="e.g. Senior Software Engineer">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="bio" style="font-size:.85rem;color:var(--muted);">Bio / Summary</label>
              <textarea class="form-control" id="bio" rows="4" placeholder="Brief professional summary..."></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-grad">
                <i class="bi bi-check-lg me-1"></i> Save Changes
              </button>
              <button type="button" class="btn btn-grad-outline" id="reset-btn">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Sync avatar card with form values
      window.syncAvatar = () => {
        const fn = (document.getElementById('first_name')?.value || '').trim();
        const ln = (document.getElementById('last_name')?.value || '').trim();
        const em = (document.getElementById('email')?.value || '').trim();
        const ph = (document.getElementById('phone')?.value || '').trim();
        const ro = (document.getElementById('target_role')?.value || '').trim();
        const un = (document.getElementById('profile-username')?.textContent || '').trim();
        const nameEl = document.getElementById('avatar-name');
        const roleEl = document.getElementById('avatar-role');
        const emEl   = document.getElementById('avatar-email');
        const phEl   = document.getElementById('avatar-phone');
        if (nameEl) nameEl.textContent = (fn || ln) ? `${fn} ${ln}`.trim() : (un && un !== '...' ? un : 'Your Name');
        if (roleEl) roleEl.textContent = ro || 'Target Role';
        if (emEl)   emEl.textContent   = em || '—';
        if (phEl)   phEl.textContent   = ph || '—';
      };

      ['first_name','last_name','email','phone','target_role'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', window.syncAvatar);
          el.addEventListener('change', window.syncAvatar);
          el.addEventListener('focus', window.syncAvatar);
        }
      });

      // Initialize Profile (populates cached + fresh DB data immediately)
      App.initProfile();

      // Reset button
      const resetBtn = document.getElementById('reset-btn');
      if (resetBtn) resetBtn.addEventListener('click', () => {
        document.getElementById('profile-form').reset();
        window.syncAvatar();
      });
    });

    // Mobile sidebar toggle
    const menu = document.getElementById('menu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
    menu.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>
</body>
</html>
