<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · ResumeAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Mobile drawer button -->
  <button class="btn btn-grad d-lg-none position-fixed m-2" style="z-index:30" id="menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar -->
  <aside class="side">
    <div class="brand"><i class="bi bi-stars"></i> ResumeAI</div>
    <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a href="upload.html"><i class="bi bi-cloud-arrow-up"></i> Upload Resume</a>
    <a href="tool.html?kind=analysis"><i class="bi bi-graph-up"></i> Resume Analysis</a>
    <a href="tool.html?kind=ats"><i class="bi bi-shield-check"></i> ATS Checker</a>
    <a href="tool.html?kind=match"><i class="bi bi-bullseye"></i> Job Matching</a>
    <a href="tool.html?kind=improve"><i class="bi bi-magic"></i> AI Improvements</a>
    <a href="history.html"><i class="bi bi-clock-history"></i> Analysis History</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a>
    <button id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h3 class="fw-bold mb-3">My Profile</h3>
    <div class="cardx" style="max-width:640px;height:auto">
      <p class="text-muted mb-3">Username: <b id="profile-username" class="text-dark">...</b></p>
      <div id="alert-box"></div>
      <form id="profile-form">
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold" for="first_name">First Name</label>
            <input type="text" class="form-control" id="first_name">
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold" for="last_name">Last Name</label>
            <input type="text" class="form-control" id="last_name">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="phone">Phone</label>
          <input type="text" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="target_role">Target Role</label>
          <input type="text" class="form-control" id="target_role" placeholder="e.g. Senior Software Engineer">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="bio">Bio / Summary</label>
          <textarea class="form-control" id="bio" rows="4" placeholder="Brief professional summary..."></textarea>
        </div>
        <button type="submit" class="btn btn-grad">Save changes</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initProfile());
  </script>
</body>
</html>
