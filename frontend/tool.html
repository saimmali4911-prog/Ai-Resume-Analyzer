<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Analysis Tool · ResumeXpert AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Mobile drawer button -->
  <button class="btn btn-grad d-lg-none position-fixed m-2" style="z-index:30" id="menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar -->
  <aside class="side">
    <div class="brand"><i class="bi bi-stars"></i> ResumeXpert AI</div>
    <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a href="upload.html"><i class="bi bi-cloud-arrow-up"></i> Upload Resume</a>
    <a href="tool.html?kind=analysis"><i class="bi bi-graph-up"></i> Resume Analysis</a>
    <a href="tool.html?kind=ats"><i class="bi bi-shield-check"></i> ATS Checker</a>
    <a href="tool.html?kind=match"><i class="bi bi-bullseye"></i> Job Matching</a>
    <a href="tool.html?kind=improve"><i class="bi bi-magic"></i> AI Improvements</a>
    <a href="history.html"><i class="bi bi-clock-history"></i> Analysis History</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a>
    <button id="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h3 class="fw-bold" id="tool-title">Analysis Tool</h3>
    <p class="text-muted" id="tool-desc">AI-powered resume evaluation.</p>

    <!-- Alert if no resumes uploaded -->
    <div class="alert alert-info d-none" id="no-resumes-alert">
      You haven't uploaded any resumes yet. <a href="upload.html" class="fw-semibold">Upload your resume now</a>
    </div>

    <!-- Tool Form -->
    <form id="toolform" class="cardx mb-4" style="height:auto">
      <label class="form-label fw-semibold" for="resume-select">Select Resume</label>
      <select id="resume-select" class="form-select mb-3">
        <option value="">Loading resumes...</option>
      </select>

      <!-- Match specific fields -->
      <div id="match-fields" class="d-none">
        <label class="form-label fw-semibold" for="job_title">Job Title (optional)</label>
        <input id="job_title" class="form-control mb-3" placeholder="e.g. Senior Backend Engineer" maxlength="150">
        <label class="form-label fw-semibold" for="job_description">Job Description</label>
        <textarea id="job_description" class="form-control mb-3" rows="8" placeholder="Paste the full job description here..."></textarea>
      </div>

      <!-- Improve specific fields -->
      <div id="improve-fields" class="d-none">
        <label class="form-label fw-semibold" for="section-select">Section to Improve</label>
        <select id="section-select" class="form-select mb-3">
          <option>Professional Summary</option>
          <option>Work Experience</option>
          <option>Technical Skills</option>
          <option>Projects</option>
          <option>Career Objective</option>
          <option>Education Description</option>
        </select>
        <label class="form-label fw-semibold" for="original-text">Original Section Text (optional)</label>
        <textarea id="original-text" class="form-control mb-3" rows="5" placeholder="Paste the text to improve (leave empty to auto-analyze from your resume)"></textarea>
        <label class="form-label fw-semibold" for="facts-text">Key Achievements / Metrics (optional)</label>
        <textarea id="facts-text" class="form-control mb-3" rows="3" placeholder="Optional: real achievements, numbers or metrics you want emphasized"></textarea>
      </div>

      <div class="d-flex align-items-center">
        <button type="submit" class="btn btn-grad">Run Analysis</button>
        <span class="spin d-none ms-3">
          <span class="spinner-border spinner-border-sm text-primary"></span>
          Analyzing, please wait…
        </span>
      </div>
    </form>

    <div id="alert"></div>
    <div id="result"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initTool());
  </script>
</body>
</html>
