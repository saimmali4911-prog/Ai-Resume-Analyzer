<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &middot; ResumeXpert AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page-wrapper">
    <!-- Navbar -->
    <nav class="navbar navbar-expand px-3 px-md-5 py-3 position-relative" style="z-index:10;">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        <i class="bi bi-stars"></i> ResumeXpert AI
      </a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-grad btn-sm px-4" href="register.html">
          <i class="bi bi-person-plus me-1"></i>Create Account
        </a>
      </div>
    </nav>

    <!-- Centered Main Content -->
    <main class="auth-main">
      <div class="auth-card auth-card-login">
        <div class="text-center mb-4">
          <div class="feature-icon">
            <i class="bi bi-person-lock" style="font-size:1.6rem;"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Welcome back</h3>
          <p class="text-muted mb-0" style="font-size:.92rem;">Sign in to your ResumeXpert AI account</p>
        </div>

        <div id="alert-box"></div>

        <form id="login-form" autocomplete="on">
          <div class="mb-3">
            <label class="form-label" for="username">
              <i class="bi bi-person me-1"></i>Username or Email
            </label>
            <input type="text" class="form-control" id="username" name="username"
                   required autofocus placeholder="Enter your username or email">
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">
              <i class="bi bi-lock me-1"></i>Password
            </label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="password" name="password"
                     required placeholder="Enter your password">
              <button type="button" class="btn p-0 position-absolute top-50 end-0 translate-middle-y me-3"
                      id="toggle-pw" style="background:none;border:none;color:var(--text2);">
                <i class="bi bi-eye" id="pw-icon"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-grad w-100 py-3" style="font-size:1rem;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-4 small">
          <span class="text-muted">Don't have an account?</span>
          <a href="register.html" class="fw-semibold" style="color:var(--p3);text-decoration:none;">
            Create one <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.initLogin();
      // Password toggle
      const btn = document.getElementById('toggle-pw');
      const inp = document.getElementById('password');
      const ico = document.getElementById('pw-icon');
      if (btn && inp && ico) {
        btn.addEventListener('click', () => {
          const show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          ico.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      }
    });
  </script>
</body>
</html>
