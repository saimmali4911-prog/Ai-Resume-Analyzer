<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · ResumeAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Public Topbar -->
  <nav class="navbar navbar-expand px-3 px-md-5 py-3 bg-transparent position-absolute w-100" style="z-index:5">
    <a class="navbar-brand fw-bold text-white" href="index.html"><i class="bi bi-stars"></i> ResumeAI</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light rounded-pill" href="login.html">Login</a>
      <a class="btn btn-light rounded-pill fw-semibold" href="register.html">Get Started</a>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="hero auth">
    <div class="container">
      <div class="cardx mx-auto text-dark" style="max-width:430px;height:auto">
        <h3 class="fw-bold mb-3">Welcome back</h3>
        <div id="alert-box"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="username">Username or Email</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-grad w-100 mt-2">Login</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="#" class="text-decoration-none text-muted">Forgot password?</a>
          <a href="register.html" class="fw-semibold">Create account</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initLogin());
  </script>
</body>
</html>
