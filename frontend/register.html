<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · ResumeXpert AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Public Topbar -->
  <nav class="navbar navbar-expand px-3 px-md-5 py-3 bg-transparent position-absolute w-100" style="z-index:5">
    <a class="navbar-brand fw-bold text-white" href="index.html"><i class="bi bi-stars"></i> ResumeXpert AI</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light rounded-pill" href="login.html">Login</a>
      <a class="btn btn-light rounded-pill fw-semibold" href="register.html">Get Started</a>
    </div>
  </nav>

  <!-- Register Section -->
  <section class="hero auth">
    <div class="container">
      <div class="cardx mx-auto text-dark" style="max-width:470px;height:auto">
        <h3 class="fw-bold mb-3">Create your account</h3>
        <div id="alert-box"></div>
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="username">Username</label>
            <input type="text" class="form-control" id="username" required minlength="3" maxlength="150" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-semibold" for="first_name">First Name</label>
              <input type="text" class="form-control" id="first_name">
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold" for="last_name">Last Name</label>
              <input type="text" class="form-control" id="last_name">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">Password (min 6 characters)</label>
            <input type="password" class="form-control" id="password" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="password_confirm">Confirm Password</label>
            <input type="password" class="form-control" id="password_confirm" required minlength="6">
          </div>
          <button type="submit" class="btn btn-grad w-100 mt-2">Sign up</button>
        </form>
        <p class="mt-3 mb-0 small text-muted">
          Already registered? <a href="login.html" class="fw-semibold">Login</a>
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initRegister());
  </script>
</body>
</html>
