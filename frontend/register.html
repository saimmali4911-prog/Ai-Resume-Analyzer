<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register &middot; ResumeXpert AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page-wrapper">
    <!-- Navbar -->
    <nav class="navbar navbar-expand px-3 px-md-5 py-3 position-relative" style="z-index:10;">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        <i class="bi bi-stars"></i> ResumeXpert AI
      </a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-grad-outline btn-sm px-4" href="login.html">Sign In</a>
      </div>
    </nav>

    <!-- Centered Main Content -->
    <main class="auth-main">
      <div class="auth-card auth-card-register">
        <div class="text-center mb-4">
          <div class="feature-icon">
            <i class="bi bi-person-plus" style="font-size:1.6rem;"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Create your account</h3>
          <p class="text-muted mb-0" style="font-size:.92rem;">Start analyzing your resume for free</p>
        </div>

        <div id="alert-box"></div>

        <form id="register-form" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" for="username">
              <i class="bi bi-at me-1"></i>Username
            </label>
            <input type="text" class="form-control" id="username"
                   required minlength="3" maxlength="150"
                   autofocus placeholder="Choose a username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">
              <i class="bi bi-envelope me-1"></i>Email Address
            </label>
            <input type="email" class="form-control" id="email"
                   required placeholder="your@email.com">
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label" for="first_name">First Name</label>
              <input type="text" class="form-control" id="first_name" placeholder="First">
            </div>
            <div class="col-6">
              <label class="form-label" for="last_name">Last Name</label>
              <input type="text" class="form-control" id="last_name" placeholder="Last">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">
              <i class="bi bi-lock me-1"></i>Password <span class="text-muted">(min 6 chars)</span>
            </label>
            <input type="password" class="form-control" id="password"
                   required minlength="6" placeholder="Create a strong password">
          </div>
          <div class="mb-4">
            <label class="form-label" for="password_confirm">
              <i class="bi bi-lock-fill me-1"></i>Confirm Password
            </label>
            <input type="password" class="form-control" id="password_confirm"
                   required minlength="6" placeholder="Repeat your password">
          </div>
          <button type="submit" class="btn btn-grad w-100 py-3" style="font-size:1rem;">
            <i class="bi bi-rocket-takeoff me-2"></i>Create Account
          </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-4 small">
          <span class="text-muted">Already have an account?</span>
          <a href="login.html" class="fw-semibold" style="color:var(--p3);text-decoration:none;">
            Sign in <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.initRegister());
  </script>
</body>
</html>
