{% extends 'base.html' %}{% block body %}
<button class="btn btn-grad d-lg-none position-fixed m-2" style="z-index:30" id="menu"><i class="bi bi-list"></i></button>
<aside class="side"><div class="brand"><i class="bi bi-stars"></i> ResumeXpert AI</div>
<a href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
<a href="{{ url_for('upload') }}"><i class="bi bi-cloud-arrow-up"></i> Upload Resume</a>
<a href="{{ url_for('tool', kind='analysis') }}"><i class="bi bi-graph-up"></i> Resume Analysis</a>
<a href="{{ url_for('tool', kind='ats') }}"><i class="bi bi-shield-check"></i> ATS Checker</a>
<a href="{{ url_for('tool', kind='match') }}"><i class="bi bi-bullseye"></i> Job Matching</a>
<a href="{{ url_for('tool', kind='improve') }}"><i class="bi bi-magic"></i> AI Improvements</a>
<a href="{{ url_for('history') }}"><i class="bi bi-clock-history"></i> Analysis History</a>
<a href="{{ url_for('profile') }}"><i class="bi bi-person-circle"></i> My Profile</a>

<main class="main">{% include '_messages.html' %}{% block content %}{% endblock %}</main>{% endblock %}
